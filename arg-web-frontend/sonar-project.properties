sonar.projectKey=ARG-Frontend-Dev
sonar.projectName=ARG-Frontend-Dev
sonar.projectVersion=1.0
 
# scan all code inside src
sonar.sources=src
 
# don’t exclude test files
sonar.exclusions=
 
# still categorize test files
sonar.test.inclusions=**/*.spec.ts,**/*.spec.js,**/__tests__/**
 
# keep blame info (better history tracking)
sonar.scm.disabled=false
 
# include coverage
sonar.coverage.exclusions=
 
# point to coverage report (we’ll generate this next)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info